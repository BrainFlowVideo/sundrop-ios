name: SunDrop

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SunDrop:
    type: application
    platform: iOS
    sources:
      - path: SunDrop
    settings:
      base:
        # Change this to your own reverse-DNS identifier before running on a device.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sundrop
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: SunDrop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: SunDrop uses the camera so you can attach a photo or short video to a gratitude note.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: SunDrop uses the microphone to record sound with your short video notes.

  SunDropTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunDropTests
    dependencies:
      - target: SunDrop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sundrop.tests

schemes:
  SunDrop:
    build:
      targets:
        SunDrop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SunDropTests
