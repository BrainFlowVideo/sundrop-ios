<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset=".5" stop-color="#FF8E6B"/><stop offset="1" stop-color="#D81159"/></linearGradient>
  <radialGradient id="glow" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="blob1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#73D2DE" stop-opacity=".9"/><stop offset="1" stop-color="#73D2DE" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".55" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#fff" stop-opacity=".15"/><stop offset=".7" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient>
  <linearGradient id="frog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDEEFB"/><stop offset=".5" stop-color="#A8D8F0"/><stop offset="1" stop-color="#7FBFE6"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE08F"/><stop offset="1" stop-color="#3E9B55"/></linearGradient>
  <clipPath id="jarClip"><rect x="232" y="268" width="560" height="560" rx="190"/></clipPath>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#6B0A33" flood-opacity=".45"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="800" cy="130" r="330" fill="#FFE9A8" opacity=".55" filter="url(#soft2)"/>
<circle cx="170" cy="900" r="300" fill="#8F2D56" opacity=".55" filter="url(#soft2)"/>
<rect width="1024" height="1024" fill="url(#glow)"/>

<!-- glass lid -->
<g filter="url(#drop)">
  <rect x="332" y="170" width="360" height="130" rx="62" fill="#FFBC42"/>
  <rect x="332" y="170" width="360" height="130" rx="62" fill="url(#glass)"/>
  <rect x="334" y="172" width="356" height="126" rx="60" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <rect x="372" y="188" width="200" height="22" rx="11" fill="#fff" opacity=".7"/>
</g>

<!-- glass jar -->
<g filter="url(#drop)">
  <rect x="232" y="268" width="560" height="560" rx="190" fill="#fff" opacity=".22"/>
</g>
<g clip-path="url(#jarClip)">
  <rect x="232" y="268" width="560" height="560" fill="#BFE9F2" opacity=".35"/>
  <circle cx="300" cy="760" r="210" fill="url(#blob1)" opacity=".8"/>
  <circle cx="760" cy="330" r="170" fill="#FFE29A" opacity=".55" filter="url(#soft)"/>

  <!-- frog -->
  <g>
    <ellipse cx="400" cy="795" rx="70" ry="32" fill="#7FBFE6"/><ellipse cx="624" cy="795" rx="70" ry="32" fill="#7FBFE6"/>
    <ellipse cx="512" cy="700" rx="215" ry="160" fill="url(#frog)"/>
    <ellipse cx="512" cy="760" rx="120" ry="80" fill="#EAF8FD"/>
    <circle cx="395" cy="560" r="78" fill="url(#frog)"/><circle cx="629" cy="560" r="78" fill="url(#frog)"/>
    <circle cx="395" cy="562" r="52" fill="#fff"/><circle cx="629" cy="562" r="52" fill="#fff"/>
    <ellipse cx="402" cy="568" rx="24" ry="32" fill="#8F2D56"/><ellipse cx="622" cy="568" rx="24" ry="32" fill="#8F2D56"/>
    <circle cx="412" cy="552" r="9" fill="#fff"/><circle cx="632" cy="552" r="9" fill="#fff"/>
    <ellipse cx="305" cy="690" rx="38" ry="22" fill="#D81159" opacity=".35"/><ellipse cx="719" cy="690" rx="38" ry="22" fill="#D81159" opacity=".35"/>
    <path d="M452 676 Q512 724 572 676" stroke="#8F2D56" stroke-width="15" fill="none" stroke-linecap="round"/>
    <circle cx="492" cy="646" r="7" fill="#6FB0D6"/><circle cx="532" cy="646" r="7" fill="#6FB0D6"/>
    <!-- sprout -->
    <rect x="504" y="410" width="16" height="140" rx="8" fill="#3E9B55"/>
    <ellipse cx="450" cy="408" rx="52" ry="26" fill="url(#leaf)" transform="rotate(-28 450 408)"/>
    <ellipse cx="574" cy="408" rx="52" ry="26" fill="url(#leaf)" transform="rotate(28 574 408)"/>
  </g>
  <!-- glass body sheen over everything inside -->
  <rect x="232" y="268" width="560" height="560" fill="url(#glass)" opacity=".55"/>
  <path d="M290 330 Q290 300 330 300 L420 300 Q300 360 290 520 Z" fill="#fff" opacity=".55" filter="url(#soft)"/>
  <rect x="268" y="360" width="30" height="300" rx="15" fill="#fff" opacity=".7"/>
  <ellipse cx="512" cy="826" rx="250" ry="22" fill="#fff" opacity=".35" filter="url(#soft)"/>
</g>
<rect x="234" y="270" width="556" height="556" rx="188" fill="none" stroke="url(#rim)" stroke-width="8"/>
</svg>
